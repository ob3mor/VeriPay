name: CI

# Free tier: GitHub Actions on a public repo. Runs the same gates the local
# pipeline runs — the backend pytest suite (SQLite) and the frontend static
# build — plus the contracts typecheck and the compose YAML syntax check
# (Docker itself is not required for a syntax check).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Migrations — offline SQL + scratch-SQLite executability + drift
        run: |
          VERIPAY_DATABASE_URL=sqlite:///./_ci_migrate.db python -m alembic upgrade head
          VERIPAY_DATABASE_URL=sqlite:///./_ci_migrate.db python -m alembic downgrade base
          VERIPAY_DATABASE_URL=sqlite:///./_ci_migrate.db python -m alembic upgrade head
          VERIPAY_DATABASE_URL=sqlite:///./_ci_migrate.db python -m alembic check
          rm -f _ci_migrate.db
      - name: Tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: Contracts typecheck
        run: npm run typecheck:contracts
      - name: Frontend static-export build
        run: node apps/web/node_modules/next/dist/bin/next build apps/web

  compose-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML syntax check (not a `docker compose config` substitute)
        run: |
          python -c "import yaml,sys; yaml.safe_load(open('infrastructure/local/docker-compose.yml', encoding='utf-8')); print('compose YAML OK')"
