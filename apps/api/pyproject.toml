[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veripay-api"
version = "0.1.0"
description = "VeriPay backend API - AI-powered invoice & payment fraud prevention (decision-support only; never payment authorization, never genuineness verdicts)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    # Required by pydantic EmailStr (used by the auth request schemas).
    "email-validator>=2.1",
    # PDF text-layer extraction (the default OcrProvider reads embedded
    # digital text; documents with a real text layer never need pixel OCR).
    # pdfminer.six is required alongside pypdf: Arabic documents must be
    # read with pdfminer (pypdf yields visual-order RTL, pdfminer logical
    # order), and it is the parse fallback for PDFs pypdf cannot read.
    "pypdf>=4.2",
    "pdfminer.six>=20240706",
    # PostgreSQL canonical driver — the compose/Docker path (postgresql+psycopg
    #:// URLs in docker-compose.yml/.env.example) needs it at `pip install .`;
    # the SQLite dev/test fallback never imports it.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    # Synthetic invoice fixtures (scripts/generate_fixtures.py).
    "reportlab>=4.2",
]
# Optional local pixel-OCR engine (VERIPAY_OCR_PROVIDER=tesseract). The
# tesseract BINARY itself is a system dependency and is checked at runtime;
# without it the pipeline falls back to the stub provider (honestly marked).
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.3",
]
# Optional cloud OCR (VERIPAY_OCR_PROVIDER=azure). F0 free-tier limits are
# honored by the adapter (page cap from settings; never auto-upgrades).
azure-ocr = [
    "azure-ai-formrecognizer>=3.3",
]
# Optional PROFILE A worker backend (VERIPAY_PROCESSING_BACKEND=celery).
celery = [
    "celery[redis]>=5.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgresql: requires a live PostgreSQL engine — the local suite skips these cleanly (no Docker/PG on the dev machine); the CI workflow runs them on its PostgreSQL 16 leg",
]
