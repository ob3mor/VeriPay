# =============================================================================
# VeriPay — PROFILE A: LOCAL_FULL (docs/ARCHITECTURE.md §6)
#
# HONESTY NOTE: Docker is not installed and WSL is unavailable on the machine
# that authored this file, so this stack has NEVER been executed. Validate with
# `docker compose -f infrastructure/local/docker-compose.yml config` before the
# first real run (CI / any Docker-equipped machine).
#
# The web app runs IN compose as a dev server (apps/web/Dockerfile) so
# `docker compose up` gives the whole demo; the production target for the
# frontend remains the static export on Azure Static Web Apps (PROFILE B).
# =============================================================================

name: veripay-local

services:
  # --- PostgreSQL: canonical database (SQLite is only the no-Docker fallback) ---
  postgres:
    image: postgres:16-alpine
    environment:
      # Dev-only credentials; mirror them in .env.example when changing.
      POSTGRES_USER: veripay
      POSTGRES_PASSWORD: veripay_dev
      POSTGRES_DB: veripay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veripay -d veripay"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- MinIO: S3-compatible document storage for PROFILE A ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Dev-only credentials (MinIO requires a >=8-char secret).
      MINIO_ROOT_USER: veripay
      MINIO_ROOT_PASSWORD: veripay-dev-change-me
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- One-shot: create the documents bucket if missing ---
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$VERIPAY_MINIO_ACCESS_KEY" "$$VERIPAY_MINIO_SECRET_KEY" && \
        mc mb --ignore-existing "local/$$VERIPAY_MINIO_BUCKET"
    environment:
      # Must match the minio service credentials above.
      VERIPAY_MINIO_ACCESS_KEY: veripay
      VERIPAY_MINIO_SECRET_KEY: veripay-dev-change-me
      VERIPAY_MINIO_BUCKET: veripay-documents
    restart: "no"

  # --- FastAPI backend (modular monolith) ---
  # apps/api/Dockerfile migrates (alembic upgrade head) then serves uvicorn.
  api:
    build:
      context: ../../apps/api # relative to this file -> <repo>/apps/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # The API's DATABASE_URL -> PostgreSQL (ARCHITECTURE §6, PROFILE A).
      # The backend reads settings with the VERIPAY_ prefix (see .env.example).
      VERIPAY_DATABASE_URL: postgresql+psycopg://veripay:veripay_dev@postgres:5432/veripay
      VERIPAY_JWT_SECRET: dev-only-insecure-secret-change-me
      VERIPAY_STORAGE_BACKEND: minio
      VERIPAY_OCR_PROVIDER: stub
      VERIPAY_PROCESSING_BACKEND: inline
      VERIPAY_MINIO_ENDPOINT: http://minio:9000
      VERIPAY_MINIO_ACCESS_KEY: veripay
      VERIPAY_MINIO_SECRET_KEY: veripay-dev-change-me
      VERIPAY_MINIO_BUCKET: veripay-documents
      VERIPAY_MINIO_SECURE: "false"
      # The browser reaches the API through the published host port.
      VERIPAY_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Next.js web app (dev server; the static export is for Azure SWA) ---
  web:
    build:
      # Repo-root context so the npm workspace (contracts package) resolves.
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      # Browser-facing API base: the host-published API port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- Optional Celery worker (only with --profile worker) ---
  # The default processing backend is "inline" (no worker needed — this is
  # what keeps the Azure demo scale-to-zero). Start with:
  #   docker compose -f infrastructure/local/docker-compose.yml --profile worker up -d
  worker:
    image: veripay-local-api:latest
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    profiles: ["worker"]
    command: sh -c "pip install --no-cache-dir '.[celery]' && celery -A app.adapters.processing.celery_backend.celery_app worker --loglevel=info"
    environment:
      VERIPAY_DATABASE_URL: postgresql+psycopg://veripay:veripay_dev@postgres:5432/veripay
      VERIPAY_JWT_SECRET: dev-only-insecure-secret-change-me
      VERIPAY_REDIS_URL: redis://redis:6379/0
      VERIPAY_OCR_PROVIDER: stub
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Redis: optional, only for background-worker work (opt-in profile) ---
  # Start with: docker compose -f infrastructure/local/docker-compose.yml --profile worker up -d
  redis:
    image: redis:7-alpine
    profiles: ["worker"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
