# =============================================================================
# VeriPay — PROFILE A: LOCAL_FULL (docs/ARCHITECTURE.md §6)
#
# HONESTY NOTE: Docker is not installed and WSL is unavailable on the machine
# that authored this file, so this stack has NEVER been executed. Validate with
# `docker compose -f infrastructure/local/docker-compose.yml config` before the
# first real run (CI / any Docker-equipped machine).
#
# The web app (apps/web) intentionally does NOT run in compose: it runs on the
# HOST with `npm run dev` (Next.js static-export target for Azure Static Web
# Apps). Only infrastructure + the API are containerized here.
# =============================================================================

name: veripay-local

services:
  # --- PostgreSQL: canonical database (SQLite is only the no-Docker fallback) ---
  postgres:
    image: postgres:16-alpine
    environment:
      # Dev-only credentials; mirror them in .env.example when changing.
      POSTGRES_USER: veripay
      POSTGRES_PASSWORD: veripay_dev
      POSTGRES_DB: veripay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veripay -d veripay"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- MinIO: S3-compatible document storage for PROFILE A ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Dev-only credentials (MinIO requires a >=8-char secret).
      MINIO_ROOT_USER: veripay
      MINIO_ROOT_PASSWORD: veripay-dev-change-me
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- One-shot: create the documents bucket if missing ---
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$VERIPAY_MINIO_ACCESS_KEY" "$$VERIPAY_MINIO_SECRET_KEY" && \
        mc mb --ignore-existing "local/$$VERIPAY_MINIO_BUCKET"
    environment:
      # Must match the minio service credentials above.
      VERIPAY_MINIO_ACCESS_KEY: veripay
      VERIPAY_MINIO_SECRET_KEY: veripay-dev-change-me
      VERIPAY_MINIO_BUCKET: veripay-documents
    restart: "no"

  # --- FastAPI backend (modular monolith) ---
  # apps/api/Dockerfile is OWNED BY THE BACKEND ENGINEER and is deliberately NOT
  # created in this workstream (infrastructure). The build fails until it exists.
  api:
    build:
      context: ../../apps/api # relative to this file -> <repo>/apps/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # The API's DATABASE_URL -> PostgreSQL (ARCHITECTURE §6, PROFILE A).
      # The backend reads settings with the VERIPAY_ prefix (see .env.example).
      VERIPAY_DATABASE_URL: postgresql+psycopg://veripay:veripay_dev@postgres:5432/veripay
      VERIPAY_JWT_SECRET: dev-only-insecure-secret-change-me
      VERIPAY_STORAGE_BACKEND: minio
      VERIPAY_OCR_PROVIDER: stub
      VERIPAY_MINIO_ENDPOINT: http://minio:9000
      VERIPAY_MINIO_ACCESS_KEY: veripay
      VERIPAY_MINIO_SECRET_KEY: veripay-dev-change-me
      VERIPAY_MINIO_BUCKET: veripay-documents
      VERIPAY_MINIO_SECURE: "false"
    ports:
      - "8000:8000"

  # --- Redis: optional, only for background-worker work (opt-in profile) ---
  # Start with: docker compose -f infrastructure/local/docker-compose.yml --profile worker up -d
  redis:
    image: redis:7-alpine
    profiles: ["worker"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
